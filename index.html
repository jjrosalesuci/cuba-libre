<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- como app desde la pantalla de inicio: pantalla completa (única forma en iPhone) -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cuba Libre" />
    <meta name="theme-color" content="#000000" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>De Oriente a Punto Cero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #game { width: 100%; height: 100%; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; }

      /* ---------- controles táctiles (solo con body.is-touch) ---------- */
      body.is-touch { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
      .tc-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; font-family: "Press Start 2P", monospace; }
      .tc-root > * { pointer-events: auto; }
      .tc-left { position: absolute; left: max(12px, env(safe-area-inset-left)); bottom: 12px; }
      .tc-right { position: absolute; right: max(12px, env(safe-area-inset-right)); bottom: 12px; width: 44vh; height: 36vh; }
      .tc-top { position: absolute; right: max(12px, env(safe-area-inset-right)); top: 8px; display: flex; gap: 8px; }

      .tc-dpad { position: relative; width: 34vh; height: 34vh; max-width: 170px; max-height: 170px; min-width: 110px; min-height: 110px;
                 border-radius: 50%; background: rgba(255,255,255,0.07); border: 2px solid rgba(255,255,255,0.22); touch-action: none; }
      .tc-arrow { position: absolute; width: 0; height: 0; border: 14px solid transparent; opacity: 0.55; }
      .tc-arrow.on { opacity: 1; }
      .tc-d-up    { left: 50%; top: 8%;    transform: translateX(-50%); border-bottom: 18px solid #fff; border-top-width: 0; }
      .tc-d-down  { left: 50%; bottom: 8%; transform: translateX(-50%); border-top: 18px solid #fff; border-bottom-width: 0; }
      .tc-d-left  { left: 8%;  top: 50%; transform: translateY(-50%); border-right: 18px solid #fff; border-left-width: 0; }
      .tc-d-right { right: 8%; top: 50%; transform: translateY(-50%); border-left: 18px solid #fff; border-right-width: 0; }

      .tc-btn { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center;
                border-radius: 50%; color: #fff; font-size: max(14px, 4vh); touch-action: none; text-shadow: 1px 1px 0 #000;
                background: rgba(255,255,255,0.14); border: 2px solid rgba(255,255,255,0.35); }
      .tc-btn.on { background: rgba(245,209,66,0.55); border-color: #f5d142; }
      .tc-cap { font-size: max(7px, 1.8vh); margin-top: 4px; opacity: 0.85; }
      .tc-a { width: 19vh; height: 19vh; min-width: 64px; min-height: 64px; right: 0; bottom: 30%; background: rgba(212,42,42,0.30); }
      .tc-b { width: 19vh; height: 19vh; min-width: 64px; min-height: 64px; left: 0; bottom: 0; background: rgba(31,79,191,0.30); }
      .tc-top .tc-btn { position: static; }
      .tc-small { width: 40px; height: 32px; border-radius: 8px; font-size: 12px; opacity: 0.8; }
      .tc-small svg { width: 18px; height: 18px; }

      .tc-start { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center;
                  justify-content: center; gap: 22px; padding: 24px; text-align: center; background: #05061a;
                  color: #fff; font: 12px "Press Start 2P", monospace; line-height: 1.8; cursor: pointer; touch-action: none; }
      .tc-start-title { font-size: 28px; color: #f5d142; text-shadow: 3px 3px 0 #d42a2a; }
      .tc-start-tap { animation: tc-blink 1s steps(2) infinite; }
      .tc-start-hint { font-size: 9px; color: #c4c4cc; max-width: 420px; }
      @keyframes tc-blink { 50% { opacity: 0; } }

      /* botón de donación (solo en la portada) */
      .donate { position: fixed; z-index: 25; top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left));
                display: flex; flex-direction: column; gap: 5px; padding: 8px 10px; border-radius: 6px; text-decoration: none;
                background: #0070ba; border: 2px solid #ffc439; color: #fff; font-family: "Press Start 2P", monospace;
                box-shadow: 3px 3px 0 #003087; touch-action: manipulation; }
      .donate:hover { background: #005ea6; }
      .donate:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #003087; }
      .donate-title { font-size: clamp(8px, 2.2vh, 18px); }
      .donate-sub { font-size: clamp(6px, 1.5vh, 12px); color: #ffc439; }
      @media (min-height: 600px) { .donate { padding: 12px 16px; gap: 8px; } }

      .tc-rotate { display: none; }
      @media (orientation: portrait) {
        body.is-touch .tc-root { display: none; }
        body.is-touch .tc-rotate { display: flex; position: fixed; inset: 0; z-index: 20; align-items: center; justify-content: center;
          padding: 24px; text-align: center; line-height: 2; background: rgba(0,0,0,0.85); color: #f5d142;
          font: 12px "Press Start 2P", monospace; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
